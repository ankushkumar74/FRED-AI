name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'services/**'
      - 'configs/metrics/**'
      - 'mkdocs.yml'
      - 'scripts/build_docs.py'
      - 'scripts/build_demo.py'
      - 'scripts/seed_demo.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same extra the docs CI job uses, so the version that passes on PR is the
      # version that deploys. A loose duplicate list here would drift.
      - run: pip install -e ".[docs]"
      - name: Split BLUEPRINT.md into site pages
        run: python scripts/build_docs.py
      - name: Build the in-browser demo
        # Must run after build_docs.py, which clears site_docs/. Builds a wheel
        # from the current source so the live demo always runs this commit.
        run: python scripts/build_demo.py --seed
      - name: Merge generated nav into mkdocs config
        run: cat nav.generated.yml >> mkdocs.yml
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
