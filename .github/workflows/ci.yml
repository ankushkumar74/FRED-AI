name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint, types, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,docs]"
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Mypy
        run: mypy --strict services shared agents
      - name: Architecture contracts
        # The boundaries in BLUEPRINT 3.1 are real only if CI enforces them. The
        # evidence-is-llm-free contract is the anti-hallucination guarantee.
        run: lint-imports --config .importlinter

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: |
          pytest tests/unit tests/integration \
            --cov=services/semantic --cov=services/query --cov=services/evidence \
            --cov-report=term-missing --cov-fail-under=85

  evals:
    name: AI quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build the fixture
        # Deterministic from a fixed seed, so eval scores are reproducible and a
        # change in score means a change in behaviour, not in the data.
        run: python scripts/seed_demo.py --out demo.duckdb
      - name: Golden-set evaluation
        # Gates live in configs/eval_gates.yaml. Falling below one fails the build.
        run: python -m agents.evals.run --dataset tests/evals/golden.jsonl --database demo.duckdb

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - name: Build the site the way Pages does
        # Catches a broken BLUEPRINT link or Mermaid fence on PR rather than
        # after it has already deployed.
        run: |
          python scripts/build_docs.py
          cat nav.generated.yml >> mkdocs.yml
          mkdocs build --strict
